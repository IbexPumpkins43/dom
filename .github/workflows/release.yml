# Builds, installs and self-tests dom on every supported platform, then uploads the packages.
# PyInstaller cannot cross-compile, so each package is built on its own runner.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: windows-2022, name: windows-x64 }
          - { os: windows-11-arm, name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: uv sync --locked

      - name: Checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pytest

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build
        run: uv run python scripts/build_release.py

      - name: Fetch the test model
        run: |
          uv run python scripts/fetch_test_assets.py
          mkdir -p "$RUNNER_TEMP/dom-data/models"
          cp .dev/models/Qwen3.5-0.8B-Q4_K_M.gguf "$RUNNER_TEMP/dom-data/models/"

      - name: Install and self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf dist/dom-*.tar.gz -C "$RUNNER_TEMP/pkg"
          sh "$RUNNER_TEMP"/pkg/dom-*/install.sh
          DOM_DATA_DIR="$RUNNER_TEMP/dom-data" "$HOME/.local/opt/dom/dom" --self-test || status=$?
          grep -E "SELF-TEST|ERROR|llama-server" "$RUNNER_TEMP/dom-data/logs/dom.log" || true
          exit "${status:-0}"

      - name: Install and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "dom-app"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$dir" -Wait
          $env:DOM_DATA_DIR = Join-Path $env:RUNNER_TEMP "dom-data"
          $p = Start-Process -FilePath (Join-Path $dir "dom.exe") -ArgumentList "--self-test" -Wait -PassThru
          Select-String -Path (Join-Path $env:DOM_DATA_DIR "logs/dom.log") -Pattern "SELF-TEST|ERROR|llama-server"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "llama-server left running" }

      - uses: actions/upload-artifact@v4
        with:
          name: dom-${{ matrix.name }}
          path: dist/*
